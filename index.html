<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'; manifest-src 'none'"

    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

      name="description"
      content="Canon Ledger is a belief-state debugger for branching game narratives."

    <title>Canon Ledger</title>

  <body>
    <a class="skip-link" href="#main-content">Skip to the ledger</a>
    <header class="site-header">
      <div>
        <p class="eyebrow">NPC belief-state debugger</p>
        <h1>Canon Ledger</h1>
      </div>
      <p id="environment-banner" class="environment-banner" role="status">

      </p>

      <div id="app-workspace" aria-busy="true">
        <p class="loading-state">Validating the local ledger…</p>

    <script type="module" src="/src/main.ts"></script>
